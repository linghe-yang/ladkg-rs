name: genconfig
version: "1.0"
author: hermitsage <dth.bht@gmail.com>
about: Generate config files for all the protocols
args:
    - num_nodes:
          short: n
          long: NumNodes
          value_name: integer
          help: specify the number of nodes in the protocol
          takes_value: true
          required: true
    - delay:
          short: d
          long: delay
          help: specify the worst case network delay (in milliseconds)
          takes_value: true
          required: true
    - trans_delay:
          long: trans_delay
          help: the delay for vss dealers to wait before forming transcript
          takes_value: true
    - block_size:
          short: b
          long: blocksize
          help: specify the number of commands per block
          takes_value: true
          required: true
    - client_base_port:
          short: C
          long: client_base_port
          help: the base port p such that the node i listens to client requests and transactions on port p+i
          takes_value: true
          required: true
    - base_port:
          short: P
          long: base_port
          help: the base port p such that the node i listens to other nodes on port p+i
          takes_value: true
          required: true
    - rbc_base_port:
          long: rbc_base_port
          help: the rbc base port p such that the node i listens to other nodes on port p+i
          takes_value: true
          required: true
    - dkg_base_port:
          long: dkg_base_port
          help: the dkg base port p such that the node i listens to other nodes on port p+i
          takes_value: true
          required: true
    - drb_base_port:
          long: drb_base_port
          help: the drb base port p such that the node i listens to other nodes on port p+i
          takes_value: true
          required: true
    - crypto:
          short: A
          long: algorithm
          help: 'Cryptographic public key algorithm to use: ED25519(default) or SECP256K1'
          possible_values:
              - ED25519
              - SECP256K1
              - NOPKI
          takes_value: true
    - num_faults:
          short: f
          long: faults
          help: number of faulty nodes, default is (n-1)/2
          takes_value: true
    - out_type:
          short: o
          long: out_type
          help: config file format; binary or json (default)
          possible_values:
              - json
              - binary
              - toml
              - yaml
          takes_value: true
    - target:
          short: t
          long: target
          help: a directory to output the configurations files
          takes_value: true
    - payload:
          short: l
          long: payload
          help: the amount of payload to send in every block
          takes_value: true
    - local:
          short: z
          long: local
          help: Local running or not
          takes_value: true
    - client_run_port:
          short: q
          long: client_run_port
          help: The port on which the client should run on
          takes_value: true

    - delta:
          long: delta
          help: the protocol delta value
          takes_value: true

    - epsilon:
          long: epsilon
          help: epsilon required
          takes_value: true
    - tri:
          long: tri
          help: tri value required
          takes_value: true
    - expo:
          long: expo
          help: Exponent for incrementing levels
          takes_value: true
    - kappa:
          long: kappa
          help: Kappa for Dumbo ACS
          takes_value: true
    - hashrand_batch:
          long: hashrand_batch
          help: hashrand_batch for DRB
          takes_value: true

    - hashrand_freq:
          long: hashrand_freq
          help: hashrand_freq for DRB
          takes_value: true